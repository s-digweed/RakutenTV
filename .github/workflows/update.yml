name: Update Rakuten TV EPG & Playlist

on:
  schedule:
    # Runs every 8 hours — at 00:00, 08:00, and 16:00 UTC
    - cron: "0 0,8,16 * * *"
  workflow_dispatch:   # allow manual trigger from the Actions tab

concurrency:
  group: rakuten-update
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false        # one region failing doesn't stop the other
      matrix:
        include:
          - region: UK
            country: GB       # expected VPN exit country (ISO code)
          - region: NL
            country: NL

    env:
      REGION: ${{ matrix.region }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests lxml pytz python-dotenv

      # Streams are geo-blocked: WireGuard config per region in secret RAKUTEN_<REGION>
      - name: Connect ${{ matrix.region }} WireGuard
        env:
          WG_CONF: ${{ secrets[format('RAKUTEN_{0}', matrix.region)] }}
          EXPECT: ${{ matrix.country }}
        run: |
          set -euo pipefail
          if ! grep -q '^\[Interface\]' <<<"${WG_CONF:-}"; then
            echo "::error::Secret RAKUTEN_${REGION} is missing or is not a WireGuard config"; exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools >/dev/null
          printf '%s\n' "$WG_CONF" | sed '/^[[:space:]]*DNS[[:space:]]*=/d' | sudo tee /etc/wireguard/wg0.conf >/dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          C="$(curl -fsS -m 20 https://ifconfig.co/country-iso 2>/dev/null || curl -fsS -m 20 https://ipinfo.io/country 2>/dev/null || true)"
          C="$(echo "$C" | tr -d '[:space:]')"
          echo "Exit country: ${C:-unknown}"
          if [ -n "$C" ] && [ "$C" != "$EXPECT" ]; then
            echo "::error::VPN exits in '$C', expected $EXPECT"; exit 1
          fi

      - name: Generate EPG and playlist (${{ matrix.region }})
        run: python generate.py

      - name: Disconnect WireGuard
        if: always()
        run: sudo wg-quick down wg0 2>/dev/null || true

      - name: Upload ${{ matrix.region }} files
        uses: actions/upload-artifact@v4
        with:
          name: rakuten-${{ matrix.region }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            epg_${{ matrix.region }}.xml
            Rakuten_${{ matrix.region }}.m3u
            .m3u_source_hash_${{ matrix.region }}

  commit:
    needs: generate
    if: ${{ !cancelled() }}   # still commit the regions that succeeded
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated files back
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download generated files
        uses: actions/download-artifact@v4
        with:
          pattern: rakuten-*
          merge-multiple: true
          path: .

      - name: Commit and push updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- 'epg_*.xml' 'Rakuten_*.m3u' '.m3u_source_hash_*'
          # Only commit if something actually changed
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update EPG and playlists [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            # newer run wins: rebase onto anything that landed meanwhile; on a conflict, abort and still publish
            git pull --rebase origin main || git rebase --abort
            git push --force-with-lease
          fi
